<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 400px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #5568d8;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #f2f2f2;
            line-height: 1.6;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎓 Student Registration</h1>

    <label>Student Name</label>
    <input type="text" id="name" placeholder="Enter your name">

    <label>Email</label>
    <input type="email" id="email" placeholder="Enter your email">

    <label>Course</label>
    <select id="course">
        <option value="">Select Course</option>
        <option>BCA</option>
        <option>BBA</option>
        <option>B.Sc</option>
        <option>MCA</option>
    </select>

    <button onclick="registerStudent()">Register Now</button>

    <div id="result"></div>

</div>

<script>

function registerStudent() {

    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let course = document.getElementById("course").value;

    if (name === "" || email === "" || course === "") {

        document.getElementById("result").innerHTML =
            "⚠️ Please enter all details.";

        return;
    }

    document.getElementById("result").innerHTML =
        "✅ Registration Successful!<br><br>" +
        "<b>Name:</b> " + name + "<br>" +
        "<b>Email:</b> " + email + "<br>" +
        "<b>Course:</b> " + course;
}

</script>

</body>
</html>
